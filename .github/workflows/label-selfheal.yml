name: Label self-heal PRs
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: write
  contents: read
jobs:
  label:
    if: ${{ startsWith(github.event.pull_request.head.ref, 'chore/selfheal') }}
    runs-on: ubuntu-latest
    steps:
      - name: Add self-heal label
        run: |
          gh label create "self-heal" --color 6f42c1 --description "Self-heal automation" 2>/dev/null || true
          gh pr edit "$PR" --add-label "self-heal"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}




