name: Image Audit
on: pull_request

jobs:
  image-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Install Node first (no pnpm cache here to avoid pnpm lookup)
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2) Enable corepack and activate pnpm 9
      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm -v

      # 3) (optional) Install deps if your audit needs them
      # - run: pnpm install --frozen-lockfile

      # 4) Run your audit script
      # - name: Oversized image audit (>300kB)
      #   run: pnpm run image:audit
