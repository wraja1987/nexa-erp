name: Image Audit
on: pull_request

jobs:
  image-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Install pnpm first (adds pnpm to PATH)
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # 2) Now it's safe to enable node caching for pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 3) (optional) install deps if your audit needs them
      # - run: pnpm install --frozen-lockfile

      # 4) run your audit script
      # - name: Oversized image audit (>300kB)
      #   run: pnpm run image:audit
