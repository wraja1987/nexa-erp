name: Verify & Self-Heal (Playwright)
on:
  pull_request:
  workflow_dispatch:
    inputs:
      prod_url:
        description: "Production URL (e.g. https://nexaai.co.uk)"
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: write

env:
  BASE_URL: \${{ inputs.prod_url || secrets.PROD_URL ||  }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm -v
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright verify
        run: pnpm exec playwright test -c playwright.selfheal.config.js -g "@prod-verify" || echo "::warning::Tests failed (will trigger self-heal)"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            reports/playwright.json
            playwright-report/**
          if-no-files-found: warn

  self_heal:
    needs: verify
    if: failure() || always()  # run to classify + possibly patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
      - run: pnpm i --frozen-lockfile
      - name: Classify failures
        id: classify
        run: node scripts/selfheal/classify-failures.mjs
      - name: Fix headers (if missing)
        if: contains(steps.classify.outputs.types, "missing-headers")
        run: node scripts/selfheal/fix-headers.mjs
      - name: Compress oversized images (>300kB)
        run: node scripts/selfheal/compress-images.mjs
      - name: Create auto-fix PR (only if changes)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(auto-fix): apply self-heal remediations"
          title: "chore(auto-fix): self-heal remediations"
          body: "Automated fixes (headers/images). Review and merge."
          branch: "auto/self-heal"
          delete-branch: true
          add-paths: |
            apps/**
            public/**
            assets/**
            **/middleware.*s
      - name: Summarize unfixables
        run: node scripts/selfheal/report.mjs
      - name: PR comment / Job summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync(".selfheal/summary.md","utf8");
            try {
              const pr = context.payload.pull_request?.number;
              if (pr) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr,
                  body
                });
              }
            } catch(e) {}
            core.summary.addRaw(body).write();

  verify_after_heal:
    needs: self_heal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
      - run: pnpm i --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Re-run Playwright (report will show green or remaining failures)
        run: pnpm exec playwright test -c playwright.selfheal.config.js -g "@prod-verify" || true
      - name: Upload artifacts (post-heal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-after-heal
          path: |
            reports/playwright.json
            playwright-report/**
          if-no-files-found: warn
