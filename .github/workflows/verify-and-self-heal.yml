name: Verify & Self-Heal (Playwright)

on:
  workflow_dispatch:
    inputs:
      prod_url:
        description: "Production URL for verification (e.g., https://nexaai.co.uk)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.3.0 --activate

      - name: Resolve BASE_URL
        run: echo "BASE_URL=${{ github.event.inputs.prod_url }}" >> $GITHUB_ENV

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright verify (self-heal only)
        run: pnpm exec playwright test -c playwright.selfheal.config.js -g "@prod-verify" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            reports/playwright.json
            playwright-report/**
          if-no-files-found: warn

  self_heal:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.3.0 --activate

      - name: Resolve BASE_URL
        run: echo "BASE_URL=${{ github.event.inputs.prod_url }}" >> $GITHUB_ENV

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Compress oversized images (>300kB)  # non-fatal
        run: node scripts/selfheal/compress-images.mjs || true

      - name: Configure git user
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create auto-fix PR (only if changes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A || true

          if git diff --cached --quiet && git diff --quiet; then
            echo "No changes detected; skipping PR."
            exit 0
          fi

          if ! git diff --cached --quiet; then
            git commit -m "ci(self-heal): automated fixes from run $GITHUB_RUN_ID"
          fi

          BRANCH="chore/self-heal-auto-$GITHUB_RUN_ID"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          git push -u origin "$BRANCH" || true

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Self-heal: automated fixes (run $GITHUB_RUN_ID)" \
            --body "Automated self-heal fixes generated by GitHub Actions." \
          || echo "PR may already exist or creation failed; continuing."

  verify_after_heal:
    if: always()
    needs: self_heal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.3.0 --activate

      - name: Resolve BASE_URL
        run: echo "BASE_URL=${{ github.event.inputs.prod_url }}" >> $GITHUB_ENV

      - name: Re-verify
        run: pnpm exec playwright test -c playwright.selfheal.config.js -g "@prod-verify" || true

      - name: Upload artifacts (post-heal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-after-heal
          path: |
            reports/playwright.json
            playwright-report/**
          if-no-files-found: warn
